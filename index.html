<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchGames - База игр</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; min-height: 100vh; }
        
        /* Сайдбар справа */
        .sidebar { width: 280px; background-color: #1a1a1a; padding: 20px; position: fixed; right: 0; height: 100%; overflow-y: auto; border-left: 1px solid #333; }
        .sidebar h2 { color: #4ade80; margin-bottom: 20px; font-size: 24px; }
        .sidebar input { width: 100%; padding: 10px; margin-bottom: 20px; background: #333; border: 1px solid #444; color: white; border-radius: 8px; outline: none; }
        .sidebar input:focus { border-color: #4ade80; }
        .category-btn { display: block; width: 100%; text-align: left; background: transparent; border: none; color: #ccc; padding: 10px; margin-bottom: 5px; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size: 16px; }
        .category-btn:hover, .category-btn.active { background: #333; color: #4ade80; font-weight: bold; }
        
        /* Основной контент */
        .main-content { margin-right: 280px; padding: 20px; flex: 1; width: calc(100% - 280px); }
        
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .game-card { background-color: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; display: flex; flex-direction: column; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 8px 12px rgba(74, 222, 128, 0.2); }
        .game-image { width: 100%; height: 130px; object-fit: cover; background-color: #333; }
        .game-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .game-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-genre { color: #aaa; font-size: 13px; margin-bottom: 15px; }
        
        /* Кнопки покупки */
        .buy-buttons { display: flex; gap: 8px; }
        .buy-btn { flex: 1; text-align: center; padding: 8px 0; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .steam-btn { background-color: #1b2838; color: #66c0f4; border: 1px solid #2a475e; }
        .steam-btn:hover { background-color: #66c0f4; color: #1b2838; }
        .epic-btn { background-color: #2a2a2a; color: #fff; border: 1px solid #444; }
        .epic-btn:hover { background-color: #fff; color: #000; }
        
        /* Пагинация */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; padding-bottom: 40px; }
        .pagination button { background-color: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .pagination button:hover:not(:disabled) { background-color: #4ade80; color: #000; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination span { font-weight: bold; font-size: 16px; }

        /* Кнопка фильтров для телефона */
        .mobile-filter-btn { display: none; position: fixed; bottom: 20px; right: 20px; background-color: #4ade80; color: black; border: none; padding: 15px 25px; border-radius: 50px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 100; cursor: pointer; }

        /* Адаптивность для телефонов */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); transition: transform 0.3s; z-index: 99; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; width: 100%; }
            .mobile-filter-btn { display: block; }
            .games-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .game-image { height: 100px; }
            .buy-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="main-content">
        <div class="games-grid" id="games-container"></div>
        
        <div class="pagination">
            <button id="prev-btn" onclick="changePage(-1)">← Назад</button>
            <span id="page-info">Стр. 1</span>
            <button id="next-btn" onclick="changePage(1)">Вперед →</button>
        </div>
    </div>

    <!-- ПРАВОЕ МЕНЮ (Поиск и категории) -->
    <div class="sidebar" id="sidebar">
        <h2>🎮 SearchGames</h2>
        <input type="text" id="search-input" placeholder="Поиск игры..." oninput="searchGames()">
        
        <button class="category-btn active" onclick="setCategory('all', this)">Все игры</button>
        <button class="category-btn" onclick="setCategory('MMORPG', this)">MMORPG</button>
        <button class="category-btn" onclick="setCategory('Shooter', this)">Шутеры</button>
        <button class="category-btn" onclick="setCategory('Strategy', this)">Стратегии</button>
        <button class="category-btn" onclick="setCategory('Racing', this)">Гонки</button>
        <button class="category-btn" onclick="setCategory('Card Game', this)">Карточные</button>
        <button class="category-btn" onclick="setCategory('MOBA', this)">MOBA</button>
        <button class="category-btn" onclick="setCategory('Fighting', this)">Файтинги</button>
    </div>

    <!-- Кнопка меню для телефонов -->
    <button class="mobile-filter-btn" onclick="toggleSidebar()">Фильтры</button>

    <script>
        const SUPABASE_URL = 'https://zngssohaxspmphdskxow.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_eaCY_hG_Zxrr5piBRIZcZg_hyyFL_c-';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentPage = 1;
        const itemsPerPage = 24;
        let totalGames = 0;
        
        let currentCategory = 'all';
        let currentSearch = '';

        async function loadGames() {
            const container = document.getElementById('games-container');
            container.innerHTML = '<p>Загрузка...</p>';

            let query = _supabase.from('games').select('*', { count: 'exact' });

            if (currentCategory !== 'all') {
                query = query.eq('genre', currentCategory);
            }
            if (currentSearch !== '') {
                query = query.ilike('title', `%${currentSearch}%`);
            }

            const { count } = await query;
            totalGames = count || 0;

            const from = (currentPage - 1) * itemsPerPage;
            const to = from + itemsPerPage - 1;
            
            const { data: games, error } = await query.range(from, to).order('id', { ascending: false });

            if (error) { 
                container.innerHTML = '<p>Ошибка загрузки</p>'; 
                return; 
            }

            container.innerHTML = '';
            if (games.length === 0) {
                container.innerHTML = '<p style="text-align: center; width: 100%; color: #aaa; grid-column: 1 / -1;">Ничего не найдено :(</p>';
            } else {
                games.forEach(game => {
                    // Кодируем название игры для ссылки
                    const encodedTitle = encodeURIComponent(game.title);
                    
                    // Ссылки на магазины
                    const steamLink = `https://store.steampowered.com/search/?term=${encodedTitle}`;
                    const epicLink = `https://store.epicgames.com/ru/browse?q=${encodedTitle}&sortBy=relevancy`;

                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <img src="${game.image_url}" class="game-image" onerror="this.src='https://via.placeholder.com/250x150?text=No+Image'">
                        <div class="game-info">
                            <div>
                                <div class="game-title" title="${game.title}">${game.title}</div>
                                <div class="game-genre">${game.genre}</div>
                            </div>
                            <div class="buy-buttons">
                                <a href="${steamLink}" target="_blank" class="buy-btn steam-btn">Steam</a>
                                <a href="${epicLink}" target="_blank" class="buy-btn epic-btn">Epic</a>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            const totalPages = Math.ceil(totalGames / itemsPerPage) || 1;
            document.getElementById('page-info').innerText = `Стр. ${currentPage} из ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = (currentPage * itemsPerPage) >= totalGames;
        }

        function changePage(direction) {
            currentPage += direction;
            loadGames();
            window.scrollTo(0, 0);
        }

        function setCategory(category, btnElement) {
            currentCategory = category;
            currentPage = 1;
            
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            loadGames();
            if(window.innerWidth <= 768) toggleSidebar();
        }

        let searchTimeout;
        function searchGames() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearch = document.getElementById('search-input').value;
                currentPage = 1;
                loadGames();
            }, 500);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        loadGames();
    </script>
</body>
</html>
