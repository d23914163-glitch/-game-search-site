<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchGames - База игр</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #333; }
        h1 { color: #4ade80; }
        .btn { background-color: #4ade80; color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background-color: #22c55e; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .game-card { background-color: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .game-card:hover { transform: translateY(-5px); }
        .game-image { width: 100%; height: 150px; object-fit: cover; background-color: #333; }
        .game-info { padding: 15px; }
        .game-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .game-genre { color: #aaa; font-size: 14px; margin-bottom: 10px; }
        .game-rating { color: #fbbf24; font-weight: bold; }
        
        /* Стили для кнопок страниц */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; padding-bottom: 40px; }
        .pagination button { background-color: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .pagination button:hover:not(:disabled) { background-color: #4ade80; color: #000; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination span { font-weight: bold; font-size: 18px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; background: #333; border: 1px solid #444; color: white; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 SearchGames</h1>
        <button class="btn" onclick="openModal()">+ Добавить игру</button>
    </header>

    <div class="games-grid" id="games-container"></div>

    <!-- Кнопки пагинации -->
    <div class="pagination">
        <button id="prev-btn" onclick="changePage(-1)">← Назад</button>
        <span id="page-info">Стр. 1</span>
        <button id="next-btn" onclick="changePage(1)">Вперед →</button>
    </div>

    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Добавить игру</h2>
            <input type="text" id="game-title" placeholder="Название игры">
            <input type="text" id="game-genre" placeholder="Жанр (Экшен, RPG...)">
            <input type="text" id="game-image" placeholder="Ссылка на картинку (URL)">
            <button class="btn" onclick="addGame()" style="width: 100%;">Сохранить</button>
            <button onclick="closeModal()" style="width: 100%; background: transparent; border: none; color: #aaa; margin-top: 10px; cursor: pointer;">Отмена</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zngssohaxspmphdskxow.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_eaCY_hG_Zxrr5piBRIZcZg_hyyFL_c-';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentPage = 1;
        const itemsPerPage = 24; // По 24 игры на страницу
        let totalGames = 0;

        async function loadGames() {
            const container = document.getElementById('games-container');
            container.innerHTML = '<p>Загрузка...</p>';

            // Считаем общее количество игр в базе
            const { count } = await _supabase.from('games').select('*', { count: 'exact', head: true });
            totalGames = count || 0;

            // Получаем игры только для текущей страницы
            const from = (currentPage - 1) * itemsPerPage;
            const to = from + itemsPerPage - 1;

            const { data: games, error } = await _supabase.from('games').select('*').range(from, to).order('id', { ascending: false });

            if (error) { 
                container.innerHTML = '<p>Ошибка загрузки</p>'; 
                return; 
            }

            container.innerHTML = '';
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <img src="${game.image_url}" class="game-image" onerror="this.src='https://via.placeholder.com/250x150?text=No+Image'">
                    <div class="game-info">
                        <div class="game-title">${game.title}</div>
                        <div class="game-genre">${game.genre}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Обновляем кнопки страниц
            const totalPages = Math.ceil(totalGames / itemsPerPage);
            document.getElementById('page-info').innerText = `Стр. ${currentPage} из ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = (currentPage * itemsPerPage) >= totalGames;
        }

        function changePage(direction) {
            currentPage += direction;
            loadGames();
            window.scrollTo(0, 0); // При листании страница прыгает наверх
        }

        async function addGame() {
            const title = document.getElementById('game-title').value;
            const genre = document.getElementById('game-genre').value;
            const image = document.getElementById('game-image').value;

            if (!title) { alert('Введи название!'); return; }

            await _supabase.from('games').insert([{ title: title, genre: genre, image_url: image, rating: 0 }]);
            closeModal();
            loadGames();
        }

        function openModal() { document.getElementById('add-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('add-modal').style.display = 'none'; }

        loadGames();
    </script>
</body>
</html>
